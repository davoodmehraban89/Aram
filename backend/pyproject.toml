[build-system]
requires = ["setuptools>=75,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "aram-backend"
version = "0.1.0"
description = "Audit-safe backend foundation for Aram financial statements"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.14,<2",
  "fastapi>=0.115,<1",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy>=2.0,<3",
  "uvicorn>=0.34,<1",
  "openpyxl>=3.1,<4",
  "argon2-cffi>=23.1,<26",
]

[project.optional-dependencies]
server-standard = ["uvicorn[standard]>=0.34,<1"]
test = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<9",
  "cryptography>=44,<47",
  "ruff>=0.11,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
