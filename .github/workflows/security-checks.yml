name: Security checks

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/security-checks.yml"
  push:
    branches: [source-data-cleanup]
    paths:
      - "backend/**"
      - ".github/workflows/security-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install project and audit tooling
        run: python -m pip install -e '.[test]' 'pip-audit>=2.7,<3'
      - name: Audit installed dependencies
        run: |
          python -m pip list --format=freeze | grep -v '^aram-backend==' > /tmp/aram-audit-requirements.txt
          python -m pip_audit -r /tmp/aram-audit-requirements.txt --strict
