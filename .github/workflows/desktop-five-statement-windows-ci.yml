name: Windows Five-Statement Pilot CI (UNRELEASED)

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/desktop-five-statement-windows-ci.yml"
  workflow_dispatch:

concurrency:
  group: aram-windows-five-pilot-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows-five-pilot:
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          architecture: x64
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend and Windows packaging tools
        shell: pwsh
        run: python -m pip install -e ".[test]" "pyinstaller>=6.10,<7"
      - name: Run desktop, synthetic demo and full pipeline integration tests
        shell: pwsh
        run: python -m pytest tests/test_desktop_five_statement.py tests/test_synthetic_five_statement_demo.py tests/test_five_statement_pipeline_integration.py tests/test_cross_statement_reconciliation.py
      - name: Generate clearly labeled synthetic inspection inputs
        shell: pwsh
        run: python -m aram_backend.synthetic_five_statement_demo --output-dir dist/DEMO-SYNTHETIC-ONLY
      - name: Prove generated sample passes the actual CLI pipeline
        shell: pwsh
        run: |
          python -m aram_backend.five_statement_pipeline_cli --file "dist/DEMO-SYNTHETIC-ONLY/ARAM-SYNTHETIC-ONLY.xlsx" --manifest "dist/DEMO-SYNTHETIC-ONLY/ARAM-SYNTHETIC-ONLY.json" > $null
          if ($LASTEXITCODE -ne 0) { throw "Synthetic end-to-end CLI review did not pass" }
      - name: Exercise native Tk menus and callbacks on Windows
        shell: pwsh
        run: python -m aram_backend.desktop_five_statement --ui-smoke
      - name: Build unsigned Windows EXE
        shell: pwsh
        run: .\desktop\build_five_statement_windows.ps1
      - name: Smoke test frozen executable, headless and native GUI
        shell: pwsh
        run: |
          $exe = ".\dist\AramFivePilot-UNRELEASED.exe"
          $headless = Start-Process -FilePath $exe -ArgumentList "--self-test" -PassThru -Wait
          if ($headless.ExitCode -ne 0) { throw "Frozen EXE self-test exit: $($headless.ExitCode)" }
          $gui = Start-Process -FilePath $exe -ArgumentList "--ui-smoke" -PassThru -Wait
          if ($gui.ExitCode -ne 0) { throw "Frozen EXE GUI smoke exit: $($gui.ExitCode)" }
          $valid = Start-Process -FilePath $exe -ArgumentList "--ui-valid-smoke" -PassThru -Wait
          if ($valid.ExitCode -ne 0) { throw "Frozen EXE valid synthetic preview exit: $($valid.ExitCode)" }
      - name: Upload unsigned, nonproduction pilot for inspection only
        uses: actions/upload-artifact@v7
        with:
          name: AramFivePilot-UNRELEASED-Windows-x64
          path: |
            backend/dist/AramFivePilot-UNRELEASED.exe
            backend/dist/DEMO-SYNTHETIC-ONLY/*
          if-no-files-found: error
          retention-days: 7
